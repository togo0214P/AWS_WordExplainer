services:
  db:
    image: postgres:18.6
    container_name: aws-word-explainer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-word_explainer}
      POSTGRES_USER: ${DB_USER:-word_explainer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD in .env}}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
