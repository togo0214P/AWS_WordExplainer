services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-word_explainer}
      POSTGRES_USER: ${DB_USER:-word_explainer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD in .env}}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:18.6
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${DB_NAME:-word_explainer}
      PGUSER: ${DB_USER:-word_explainer}
      PGPASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD in .env}}
    volumes:
      - ./db:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - psql -v ON_ERROR_STOP=1 -f /scripts/schema.sql && psql -v ON_ERROR_STOP=1 -f /scripts/seed.sql

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-word_explainer}
      DB_USER: ${DB_USER:-word_explainer}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?Set DB_PASSWORD in .env}}
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 5

  view:
    build:
      context: ./view
    restart: unless-stopped
    env_file:
      - path: ${VIEW_ENV_FILE:-./view/.env.local}
        required: false
    environment:
      API_PROXY_TARGET: http://api:8080
      VITE_API_BASE_URL: ""
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIEW_PORT:-5173}:5173"
    volumes:
      - ./view/src:/app/src:ro

volumes:
  postgres_data:
